# This file is a starting point for your Codemagic configuration.
# Read more about codemagic.yaml configuration here:
# https://docs.codemagic.io/yaml-basic-configuration/

workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - flutter packages pub get
      - echo "Building Flutter app for Android..."
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
