name: datacharge
description: "All-in-One Offline Shorts/Reels Hub — DataCharge"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Video playback
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Local database / offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP + connectivity
  http: ^1.2.1
  connectivity_plus: ^6.0.3
  dio: ^5.4.3+1

  # Background caching & file management
  flutter_cache_manager: ^3.3.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # UI helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  fluttertoast: ^8.2.5
  font_awesome_flutter: ^10.7.0
  percent_indicator: ^4.2.3
  animations: ^2.0.11

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0
  startapp_sdk: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
